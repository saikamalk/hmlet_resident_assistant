name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Run security evaluation
        run: python eval/run_security_eval.py
      - name: Run retrieval evaluation
        run: python eval/run_retrieval_eval.py
      - name: Run answer-quality evaluation
        run: python eval/run_answer_quality_eval.py
