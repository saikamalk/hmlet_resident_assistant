name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.12.17
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Run unit and API tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Run security evaluation
        run: uv run --locked python eval/run_security_eval.py
      - name: Run retrieval evaluation
        run: uv run --locked python eval/run_retrieval_eval.py
      - name: Run answer-quality evaluation
        run: uv run --locked python eval/run_answer_quality_eval.py
